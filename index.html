<!DOCTYPE html>
<html>
<title>Course Enrollement</title>
</head>

<body>
    <from>
        <label>Full name:<input type="name" value="Ali Ahmed"></label>
        <br></br>
        <label>Department:<select name="dept"></label><br>
        <option>software</option>
        <option>Networks</option>
        <br></br>

        <label>
            Course:<input type="number"  value="3">
        </label>
        <br></br>
        <label>Start date:<input type="date" name="Start"></label><br></br>
        <label>Lab time<input type="time" name="start-time"></label><br></br>

        <fieldset>
            <legend>Study mode</legend>
            <label><input type="radio" name="size" value="M">Morning</label>
            <label><input type="radio" name="size" value="E">Evening</label>
            <br></br>
        </fieldset>
        <label>Profile color:<input type="Color" name="red"></label><br></br>
        <label>ID photo:<input type="file" name="photo"></label><br></br>
        <label>Note:<textarea name="message" rows="Note"></textarea></label><br></br>
        <button type="submit">Enroll</button><br></br>
    </from>
</body>
</html>
